name: jkh_local_lab

services:
  nginx:
    image: nginx:stable
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    command: ["gunicorn", "--reload", "-b", "0.0.0.0:5000", "app:app"]
    ports:
      - "127.0.0.1:5055:5000"
    environment:
      ENV_TYPE: LOCAL_LAB
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: jkh_local_lab
      DB_USER: jkh_local
      DB_PASSWORD: ${JKH_LOCAL_DB_PASSWORD:?LOCAL_LAB test password required}
      SECRET_KEY: ${JKH_LOCAL_SESSION_SECRET:?LOCAL_LAB session key required}
      SESSION_COOKIE_SECURE: "0"
    volumes:
      - ./backend:/app
      - ./web:/app/web:ro
    networks:
      - frontend
      - database
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s

  mysql:
    image: mysql:8.0
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${JKH_LOCAL_ROOT_PASSWORD:?LOCAL_LAB test root password required}
      MYSQL_DATABASE: jkh_local_lab
      MYSQL_USER: jkh_local
      MYSQL_PASSWORD: ${JKH_LOCAL_DB_PASSWORD:?LOCAL_LAB test password required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s

  playwright:
    profiles: ["test"]
    build: ./local-lab/playwright
    init: true
    shm_size: 1gb
    environment:
      JKH_LOCAL_BASE_URL: http://nginx
    volumes:
      - ./local-lab/playwright/tests:/tests/tests:ro
    networks:
      - frontend
    depends_on:
      nginx:
        condition: service_started

networks:
  frontend: {}
  database:
    internal: true

volumes:
  mysql_data: {}
