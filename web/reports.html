<!DOCTYPE html>

    <!-- JKH CANON FIX: suppress false "Guest: read-only" dialogs for logged-in users (must run BEFORE data.js) -->
    <script>
    (function(){
      function jkhSafeParse(s){ try { return JSON.parse(s); } catch(e){ return null; } }
      function jkhHasValidSession(){
        try{
          var sess = jkhSafeParse(localStorage.getItem("auth_session_v1") || "null");
          if(!sess || !sess.userId) return false;
          if(sess.expiresAt && Date.now() > sess.expiresAt) return false;
          return true;
        }catch(e){ return false; }
      }
      if(!jkhHasValidSession()) return;

      var BLOCK = [
        "Гость: только просмотр. Войдите, чтобы сохранять.",
        "Гость: только просмотр",
        "только просмотр"
      ];
      function shouldBlock(msg){
        msg = String(msg || "");
        for(var i=0;i<BLOCK.length;i++){
          if(msg.indexOf(BLOCK[i]) !== -1) return true;
        }
        return false;
      }

      var _alert = window.alert;
      var _confirm = window.confirm;

      window.alert = function(msg){
        if(shouldBlock(msg)) return;
        return _alert.call(window, msg);
      };
      window.confirm = function(msg){
        if(shouldBlock(msg)) return true; // allow action to proceed for logged-in users
        return _confirm.call(window, msg);
      };
    })();
    </script>
    <script src="data.js"></script>
    <script src="layout.js"></script>

    <style>
        /* Локальные стили под макет "справки.png" */
        .page-title { margin: 0 0 8px 0; font-size: 26px; font-weight: 700; }

        .reports-wrap {

<script>
function getAbonentIdFromURL() {
    const params = new URLSearchParams(window.location.search || "");
    return String(params.get("abonent") || "").trim();
}

function setBackLink(id) {
    const back = document.getElementById("backToCard");
    if (back && id) back.href = "abonent_card.html?abonent=" + encodeURIComponent(id);
}

function showReportsError(reason) {
    const hasId = !!getAbonentIdFromURL();
    const isNotFound = reason === "ABONENT_NOT_FOUND";
    const msg = isNotFound
        ? "Абонент не найден после загрузки данных с сервера. Вернитесь в карточку и попробуйте снова."
        : "Не передан параметр abonent в URL. Откройте справки из карточки абонента.";
    const title = document.getElementById("abonentTitle");
    if (title) title.textContent = "Справки недоступны";
    const tbody = document.getElementById("abonentInfoBody");
    if (tbody) tbody.innerHTML = '<tr><td colspan="14" style="color:#b00000;font-weight:bold;">' + msg + '</td></tr>';
    const openBtn = document.getElementById("openReport01");
    if (openBtn) openBtn.disabled = true;
    const chooseBtn = document.getElementById("repChooseBtn");
    if (chooseBtn) chooseBtn.disabled = true;
    try { console.warn("[reports] init blocked", { reason: isNotFound ? "ABONENT_NOT_FOUND" : "MISSING_ABONENT_ID", abonent: hasId ? getAbonentIdFromURL() : "" }); } catch(e) {}
    try { alert(msg); } catch(e) {}
}

function showMissingAbonentError() { showReportsError("MISSING_ABONENT_ID"); }
function showAbonentNotFoundError() { showReportsError("ABONENT_NOT_FOUND"); }

function getReportsDataState() {
    return (window.JKH_UI_STATE && window.JKH_UI_STATE.data) ? window.JKH_UI_STATE.data : null;
}

function isServerFirstReady() {
    const st = getReportsDataState();
    if (!st) return false;
    const status = String(st.status || "");
    if (status !== "ready" && status !== "empty") return false;
    if (Object.prototype.hasOwnProperty.call(st, "source") && String(st.source || "") !== "server") return false;
    return true;
}

function getAbonentFromData(id) {
    if (!id || !(window.Data && typeof window.Data.getDb === "function")) return null;
    const db = window.Data.getDb();
    return (db && db.abonents) ? (db.abonents[String(id)] || null) : null;
}

function waitForServerFirstAbonent(id, timeoutMs) {
    return new Promise((resolve) => {
        const started = Date.now();
        let done = false;
        let timer = null;

        function finish(result) {
            if (done) return;
            done = true;
            try { window.removeEventListener("JKH_UI_STATE_CHANGED", check); } catch(e) {}
            if (timer) clearInterval(timer);
            resolve(result);
        }

        function check() {
            if (!isServerFirstReady()) {
                if (Date.now() - started >= timeoutMs) finish(null);
                return;
            }
            finish(getAbonentFromData(id));
        }

        try { window.addEventListener("JKH_UI_STATE_CHANGED", check); } catch(e) {}
        timer = setInterval(check, 100);
        check();
    });
}

function getReportsUrlParams(){
    try { return new URLSearchParams(window.location.search || ""); } catch(e) { return new URLSearchParams(""); }
}

function extractOwnerFromScopedDbKey(scoped){
    const m = String(scoped || "").match(/^jkhdb::(.+?)::abonents_db_v1$/);
    return m ? String(m[1] || "") : "";
}

function getReportsOwnerId(){
    const params = getReportsUrlParams();
    const dbKey = String(params.get("db") || "").trim();
    const ownerParam = String(params.get("owner") || "").trim();
    const ownerFromDb = extractOwnerFromScopedDbKey(dbKey);
    if (ownerFromDb) return ownerFromDb;
    if (ownerParam) return ownerParam;
    try {
        if (window.JKHStore && typeof JKHStore.getOwnerId === "function") return String(JKHStore.getOwnerId() || "").trim();
    } catch(e) {}
    return "";
}

function appendReportsContextToHref(href){
    const params = getReportsUrlParams();
    const dbKey = String(params.get("db") || "").trim();
    const ownerParam = String(params.get("owner") || "").trim();
    if (dbKey) href += "&db=" + encodeURIComponent(dbKey);
    if (ownerParam) href += "&owner=" + encodeURIComponent(ownerParam);
    return href;
}

function storeGetCanonical(key, ownerId){
    try { return (window.JKHStore && JKHStore.getRaw) ? JKHStore.getRaw(key, ownerId) : null; } catch(e) { return null; }
}

function storeSetCanonical(key, value, ownerId){
    try { return (window.JKHStore && JKHStore.setRaw) ? JKHStore.setRaw(key, value, ownerId) : false; } catch(e) { return false; }
}

function getCanonicalAbonent(id){
    if (!id || !(window.Data && typeof window.Data.getDb === "function")) return null;
    const db = window.Data.getDb();
    return (db && db.abonents) ? (db.abonents[String(id)] || null) : null;
}

async function ensureCanonicalAbonent(id){
    let abonent = getCanonicalAbonent(id);
    if (abonent && !String(abonent.uid || "").trim()) {
        if (window.Data && typeof Data.ensureAbonentUid === "function") {
            await Data.ensureAbonentUid(id, { source: "reports" });
            abonent = getCanonicalAbonent(id);
        }
    }
    return abonent;
}

function getCanonicalPeriodMeta(id, abonent){
    const ownerId = getReportsOwnerId();
    const params = getReportsUrlParams();
    const uidFromUrl = String(params.get("uid") || "").trim();
    const uid = String(abonent && abonent.uid || uidFromUrl || "").trim();
    const periodKey = (window.Data && typeof Data.resolveCalcPeriodStorageKey === "function")
        ? String(Data.resolveCalcPeriodStorageKey(abonent) || "").trim()
        : "";
    const activeKey = (window.Data && typeof Data.resolveCalcPeriodActiveStorageKey === "function")
        ? String(Data.resolveCalcPeriodActiveStorageKey(abonent) || "").trim()
        : "";
    return {
        abonentId: String(id || "").trim(),
        uid: uid,
        ownerId: ownerId,
        periodKey: periodKey,
        activeKey: activeKey,
        reportKey: uid ? ("report_period_" + uid) : ""
    };
}

function fillAbonentCardHeader(id, a) {
    if (!id) { showMissingAbonentError(); return false; }
    if (!a) { showAbonentNotFoundError(); return false; }

    document.getElementById("abonentTitle").textContent = "Общие данные " + (a.fio || "");

    const fioParts = (a.fio || "").split(" ");
    const last = fioParts[0] || "";
    const name = fioParts[1] || "";
    const mid  = fioParts[2] || "";

    document.getElementById("abonentInfoBody").innerHTML = `
      <tr>
        <td>${id}</td>
        <td>${a.regnum || ""}</td>
        <td>${last}</td>
        <td>${name}</td>
        <td>${mid}</td>
        <td>${a.square ?? ""}</td>
        <td>${a.share ?? ""}</td>
        <td>${a.rooms ?? ""}</td>
        <td>${a.city ?? ""}</td>
        <td>${a.street ?? ""}</td>
        <td>${a.house ?? ""}</td>
        <td>${a.flat ?? ""}</td>
        <td>${a.uid ?? ""}</td>
        <td>${a.phone ?? ""}</td>
      </tr>
    `;

    setBackLink(id);
    return true;
}

function loadAutoPeriod(abonent) {
    const id = getAbonentIdFromURL();
    if (!id) return;
    const fromEl = document.getElementById("repFrom");
    const toEl = document.getElementById("repTo");
    if (!fromEl || !toEl) return;

    const meta = getCanonicalPeriodMeta(id, abonent);
    const params = getReportsUrlParams();
    const urlFrom = String(params.get("from") || "").trim();
    const urlTo = String(params.get("to") || "").trim();

    if (urlFrom || urlTo) {
        fromEl.value = urlFrom;
        toEl.value = urlTo;
        if (isValidPeriod(urlFrom, urlTo)) saveCanonicalPeriod(abonent, urlFrom, urlTo, { silent: true, source: "url" });
        try {
            console.log("[reports][bootstrap-period]", {
                source: "url",
                abonentId: meta.abonentId,
                uid: meta.uid,
                ownerId: meta.ownerId,
                reportKey: meta.reportKey,
                periodKey: meta.periodKey,
                activeKey: meta.activeKey,
                from: fromEl.value || "",
                to: toEl.value || ""
            });
        } catch(eUrlBootstrapLog) {}
        try { console.log("[reports][calc-period][restored]", { source: "url", from: fromEl.value || "", to: toEl.value || "", periodKey: meta.periodKey, activeKey: meta.activeKey }); } catch(eUrlLog) {}
        return;
    }

    let reportRaw = null;
    let raw = null;
    let activeRaw = null;
    let reportPeriod = null;
    let p = null;
    try {
        reportRaw = /^report_period_uid_/.test(meta.reportKey) ? storeGetCanonical(meta.reportKey, meta.ownerId) : null;
        reportPeriod = reportRaw ? JSON.parse(reportRaw) : null;
        raw = meta.periodKey ? storeGetCanonical(meta.periodKey, meta.ownerId) : null;
        activeRaw = meta.activeKey ? storeGetCanonical(meta.activeKey, meta.ownerId) : null;
        p = raw ? JSON.parse(raw) : null;
    } catch(e) {
        reportPeriod = null;
        p = null;
    }

    try {
        console.log("[reports][calc-period][load-canonical]", {
            abonentId: meta.abonentId,
            uid: meta.uid,
            ownerId: meta.ownerId,
            reportKey: meta.reportKey,
            reportRaw: reportRaw,
            periodKey: meta.periodKey,
            activeKey: meta.activeKey,
            activeRaw: activeRaw,
            periodRaw: raw
        });
    } catch(eLoadLog) {}

    if (reportPeriod && isValidPeriod(String(reportPeriod.from || ""), String(reportPeriod.to || ""))) {
        fromEl.value = reportPeriod.from || "";
        toEl.value = reportPeriod.to || "";
        try {
            console.log("[reports][bootstrap-period]", {
                source: "report_period_uid",
                abonentId: meta.abonentId,
                uid: meta.uid,
                ownerId: meta.ownerId,
                reportKey: meta.reportKey,
                periodKey: meta.periodKey,
                activeKey: meta.activeKey,
                from: fromEl.value || "",
                to: toEl.value || ""
            });
        } catch(eReportBootstrapLog) {}
        try { console.log("[reports][calc-period][restored]", { source: "canonical-report", from: fromEl.value || "", to: toEl.value || "", reportKey: meta.reportKey, periodKey: meta.periodKey, activeKey: meta.activeKey }); } catch(eReportRestoreLog) {}
        return;
    }

    if (activeRaw === "1" && p && isValidPeriod(String(p.from || ""), String(p.to || ""))) {
        fromEl.value = p.from || "";
        toEl.value = p.to || "";
        try {
            console.log("[reports][bootstrap-period]", {
                source: "calc_period_uid",
                abonentId: meta.abonentId,
                uid: meta.uid,
                ownerId: meta.ownerId,
                reportKey: meta.reportKey,
                periodKey: meta.periodKey,
                activeKey: meta.activeKey,
                from: fromEl.value || "",
                to: toEl.value || ""
            });
        } catch(eCalcBootstrapLog) {}
        try { console.log("[reports][calc-period][restored]", { source: "canonical", from: fromEl.value || "", to: toEl.value || "", periodKey: meta.periodKey, activeKey: meta.activeKey }); } catch(eRestoreLog) {}
        return;
    }
    try {
        console.warn("[reports][bootstrap-period]", {
            source: "missing",
            abonentId: meta.abonentId,
            uid: meta.uid,
            ownerId: meta.ownerId,
            reportKey: meta.reportKey,
            periodKey: meta.periodKey,
            activeKey: meta.activeKey,
            reason: "PERIOD_NOT_FOUND"
        });
    } catch(eMissingBootstrapLog) {}
}

function isValidPeriod(from, to){
    if (!from || !to) return false;
    const a = new Date(from), b = new Date(to);
    return a.toString() !== "Invalid Date" && b.toString() !== "Invalid Date" && a <= b;
}

function saveCanonicalPeriod(abonent, from, to, options){
    const opts = options || {};
    const id = getAbonentIdFromURL();
    const fromValue = String(from || "").trim();
    const toValue = String(to || "").trim();

    if (!isValidPeriod(fromValue, toValue)) {
        if (!opts.silent) alert("Период не выбран или указан неверно.");
        return false;
    }

    const meta = getCanonicalPeriodMeta(id, abonent);
    if (!meta.periodKey || !meta.activeKey || !meta.reportKey || !/^report_period_uid_/.test(meta.reportKey) || !meta.uid || !meta.ownerId) {
        try { console.warn("[reports][calc-period][save][missing-canonical-context]", meta); } catch(e) {}
        if (!opts.silent) alert("Период не выбран или указан неверно.");
        return false;
    }

    try {
        console.log("[reports][calc-period][save]", {
            abonentId: meta.abonentId,
            uid: meta.uid,
            ownerId: meta.ownerId,
            periodKey: meta.periodKey,
            activeKey: meta.activeKey,
            reportKey: meta.reportKey,
            from: fromValue,
            to: toValue,
            source: String(opts.source || "manual")
        });
    } catch(e) {}

    const payload = JSON.stringify({ from: fromValue, to: toValue });
    storeSetCanonical(meta.periodKey, payload, meta.ownerId);
    storeSetCanonical(meta.activeKey, "1", meta.ownerId);
    storeSetCanonical(meta.reportKey, payload, meta.ownerId);

    const periodRaw = storeGetCanonical(meta.periodKey, meta.ownerId);
    const activeRaw = storeGetCanonical(meta.activeKey, meta.ownerId);
    const reportRaw = storeGetCanonical(meta.reportKey, meta.ownerId);
    let parsedPeriod = null;
    let parsedReportPeriod = null;
    try { parsedPeriod = periodRaw ? JSON.parse(periodRaw) : null; } catch(e) { parsedPeriod = null; }
    try { parsedReportPeriod = reportRaw ? JSON.parse(reportRaw) : null; } catch(e) { parsedReportPeriod = null; }

    try {
        console.log("[reports][calc-period][save-confirm]", {
            abonentId: meta.abonentId,
            uid: meta.uid,
            ownerId: meta.ownerId,
            periodKey: meta.periodKey,
            activeKey: meta.activeKey,
            reportKey: meta.reportKey,
            periodRaw: periodRaw,
            activeRaw: activeRaw,
            reportRaw: reportRaw,
            parsedPeriod: parsedPeriod,
            parsedReportPeriod: parsedReportPeriod,
            ok: !!(parsedPeriod && parsedPeriod.from === fromValue && parsedPeriod.to === toValue && parsedReportPeriod && parsedReportPeriod.from === fromValue && parsedReportPeriod.to === toValue && activeRaw === "1")
        });
    } catch(e) {}
    try {
        console.log("[report-period][readback]", {
            abonentId: meta.abonentId,
            uid: meta.uid,
            ownerId: meta.ownerId,
            periodKey: meta.periodKey,
            activeKey: meta.activeKey,
            reportKey: meta.reportKey,
            periodReadback: parsedPeriod,
            activeReadback: activeRaw,
            reportReadback: parsedReportPeriod,
            ok: !!(parsedPeriod && parsedPeriod.from === fromValue && parsedPeriod.to === toValue && parsedReportPeriod && parsedReportPeriod.from === fromValue && parsedReportPeriod.to === toValue && activeRaw === "1"),
            source: String(opts.source || "manual")
        });
    } catch(eReadbackLog) {}

    if (!parsedPeriod || parsedPeriod.from !== fromValue || parsedPeriod.to !== toValue || !parsedReportPeriod || parsedReportPeriod.from !== fromValue || parsedReportPeriod.to !== toValue || activeRaw !== "1") {
        if (!opts.silent) alert("Период не выбран или указан неверно.");
        return false;
    }

    return true;
}

async function initReportsPage() {
    const id = getAbonentIdFromURL();
    if (!id) { showMissingAbonentError(); return; }
    setBackLink(id);

    await waitForServerFirstAbonent(id, 10000);
    const abonent = await ensureCanonicalAbonent(id);
    if (!fillAbonentCardHeader(id, abonent)) return;
    loadAutoPeriod(abonent);

    document.getElementById("repChooseBtn").addEventListener("click", () => {
        const from = document.getElementById("repFrom").value;
        const to   = document.getElementById("repTo").value;

        if (!saveCanonicalPeriod(abonent, from, to)) return;
        alert("Период для справки выбран: " + from + " — " + to);
    });

    document.getElementById("openReport01").addEventListener("click", () => {
        const currentId = getAbonentIdFromURL();
        if (!currentId) { showMissingAbonentError(); return; }

        const from = document.getElementById("repFrom").value;
        const to   = document.getElementById("repTo").value;

        if (!saveCanonicalPeriod(abonent, from, to)) return;

        let href = "spravka_sud.html?abonent=" + encodeURIComponent(currentId) + "&from=" + encodeURIComponent(from || "") + "&to=" + encodeURIComponent(to || "");
        href = appendReportsContextToHref(href);
        location.href = href;
    });
}

document.addEventListener("DOMContentLoaded", () => {
    initReportsPage().catch((e) => {
        try { console.error("[reports] init failed", e); } catch(_) {}
        if (getAbonentIdFromURL()) showAbonentNotFoundError();
        else showMissingAbonentError();
    });
});
</script>

<script>closeLayout();</script>
