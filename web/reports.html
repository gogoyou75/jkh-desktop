<!DOCTYPE html>

    <script src="constants.js"></script>

    <!-- JKH CANON FIX: suppress false "Guest: read-only" dialogs for logged-in users (must run BEFORE data.js) -->
    <script>
    (function(){
      function jkhSafeParse(s){ try { return JSON.parse(s); } catch(e){ return null; } }
      function jkhHasValidSession(){
        try{
          var sess = jkhSafeParse(localStorage.getItem("auth_session_v1") || "null");
          if(!sess || !sess.userId) return false;
          if(sess.expiresAt && Date.now() > sess.expiresAt) return false;
          return true;
        }catch(e){ return false; }
      }
      if(!jkhHasValidSession()) return;

      var BLOCK = [
        "Гость: только просмотр. Войдите, чтобы сохранять.",
        "Гость: только просмотр",
        "только просмотр"
      ];
      function shouldBlock(msg){
        msg = String(msg || "");
        for(var i=0;i<BLOCK.length;i++){
          if(msg.indexOf(BLOCK[i]) !== -1) return true;
        }
        return false;
      }

      var _alert = window.alert;
      var _confirm = window.confirm;

      window.alert = function(msg){
        if(shouldBlock(msg)) return;
        return _alert.call(window, msg);
      };
      window.confirm = function(msg){
        if(shouldBlock(msg)) return true; // allow action to proceed for logged-in users
        return _confirm.call(window, msg);
      };
    })();
    </script>
    <script src="data.js"></script>
    <script src="layout.js"></script>

    <style>
        /* Локальные стили под макет "справки.png" */
        .page-title { margin: 0 0 8px 0; font-size: 26px; font-weight: 700; }
        .page-subtitle { margin: 0 0 10px 0; font-size: 18px; font-weight: 700; }

        .reports-wrap {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            margin-top: 10px;
        }

        .period-card {
            width: 360px;
            border: 2px solid #000;
            padding: 14px;
            box-sizing: border-box;
            background: #fff;
        }
        .period-card h4 {
            margin: 0 0 12px 0;
            font-size: 14px;
            font-weight: 700;
        }
        .period-card label {
            display: block;
            font-size: 13px;
            margin: 10px 0 6px 0;
        }
        .period-card input[type="date"]{
            width: 100%;
            height: 28px;
            border: 2px solid #000;
            padding: 2px 6px;
            box-sizing: border-box;
        }
        .period-card .btn-wide{
            width: 100%;
            margin-top: 14px;
            height: 34px;
            border: 2px solid #000;
            background: #e5e5e5;
            cursor: pointer;
            font-size: 13px;
        }

        .reports-table-wrap { flex: 1; }
        .reports-table { table-layout: fixed; }
        .reports-table th, .reports-table td { font-size: 13px; }
        .reports-table .open-btn {
            border: 2px solid #000;
            background: #e5e5e5;
            padding: 6px 14px;
            cursor: pointer;
        }

        /* ===== ВЫРАВНИВАНИЕ ШИРИН КОЛОНОК "ОБЩИЕ ДАННЫЕ" ===== */
        #abonentInfoTable { width: 100%; table-layout: fixed; }
        #abonentInfoTable th, #abonentInfoTable td{
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<script>renderLayout();</script>

<h2 class="page-title">Справки</h2>
<h3 class="page-subtitle" id="abonentTitle">Общие данные</h3>

<table id="abonentInfoTable">
    <!-- ===== фиксируем ширины под 14 колонок (с улицей) ===== -->

        <col style="width:8%">  <!-- Имя -->
        <col style="width:8%">  <!-- Отчество -->
        <col style="width:6%">  <!-- Общая площадь -->
        <col style="width:6%">  <!-- право собственности -->
        <col style="width:6%">  <!-- кол комнат -->
        <col style="width:7%">  <!-- город -->
        <col style="width:10%"> <!-- улица -->

    <thead>
    <tr>

        <th>Фамилия</th>

        <th>Отчество</th>

        <th>город</th>
        <th>улица</th>
        <th>дом</th>
        <th>кв</th>
        <th>Уникальный ID</th>
        <th>телефон</th>

    </thead>

</table>

<div class="reports-wrap">

    <div class="reports-table-wrap">
        <table class="reports-table">
            <colgroup>
                <col style="width:8%">
                <col style="width:52%">
                <col style="width:20%">
                <col style="width:20%">
            </colgroup>
            <thead>
            <tr>
                <th>Код</th>
                <th>Название справки</th>
                <th>Назначение</th>
                <th>Действие</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>01</td>
                <td>РАСЧЁТ ВЗЫСКИВАЕМОЙ СУММЫ</td>
                <td>для суда</td>
                <td><button class="open-btn" id="openReport01" type="button">ОТКРЫТЬ</button></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="period-card">
        <h4>Выберите период для справки:</h4>

        <label for="repFrom">Дата начала:</label>
        <input id="repFrom" type="date" value="">

        <label for="repTo">Дата окончания:</label>
        <input id="repTo" type="date" value="">

        <button class="btn-wide" id="repChooseBtn" type="button">ВЫБРАТЬ</button>
    </div>

</div>

<div class="bottom-nav">
    <a href="#" class="back-btn" id="backToCard">⬅ назад</a>
</div>

<script>
function getAbonentIdFromURL() {
    const params = new URLSearchParams(window.location.search || "");
    return String(params.get("abonent") || "").trim();
}

function setBackLink(id) {
    const back = document.getElementById("backToCard");
    if (back && id) back.href = "abonent_card.html?abonent=" + encodeURIComponent(id);
}

function showReportsError(reason) {
    const hasId = !!getAbonentIdFromURL();
    const isNotFound = reason === "ABONENT_NOT_FOUND";
    const msg = isNotFound
        ? "Абонент не найден после загрузки данных с сервера. Вернитесь в карточку и попробуйте снова."
        : "Не передан параметр abonent в URL. Откройте справки из карточки абонента.";
    const title = document.getElementById("abonentTitle");
    if (title) title.textContent = "Справки недоступны";
    const tbody = document.getElementById("abonentInfoBody");
    if (tbody) tbody.innerHTML = '<tr><td colspan="14" style="color:#b00000;font-weight:bold;">' + msg + '</td></tr>';
    const openBtn = document.getElementById("openReport01");
    if (openBtn) openBtn.disabled = true;
    const chooseBtn = document.getElementById("repChooseBtn");
    if (chooseBtn) chooseBtn.disabled = true;
    try { console.warn("[reports] init blocked", { reason: isNotFound ? "ABONENT_NOT_FOUND" : "MISSING_ABONENT_ID", abonent: hasId ? getAbonentIdFromURL() : "" }); } catch(e) {}
    try { alert(msg); } catch(e) {}
}

function showMissingAbonentError() { showReportsError("MISSING_ABONENT_ID"); }
function showAbonentNotFoundError() { showReportsError("ABONENT_NOT_FOUND"); }

function getReportsDataState() {
    return (window.JKH_UI_STATE && window.JKH_UI_STATE.data) ? window.JKH_UI_STATE.data : null;
}

function isServerFirstReady() {
    const st = getReportsDataState();
    if (!st) return false;
    const status = String(st.status || "");
    if (status !== "ready" && status !== "empty") return false;
    if (Object.prototype.hasOwnProperty.call(st, "source") && String(st.source || "") !== "server") return false;
    return true;
}

function getAbonentFromData(id) {
    if (!id || !(window.Data && typeof window.Data.getDb === "function")) return null;
    const db = window.Data.getDb();
    return (db && db.abonents) ? (db.abonents[String(id)] || null) : null;
}

function waitForServerFirstAbonent(id, timeoutMs) {
    return new Promise((resolve) => {
        const started = Date.now();
        let done = false;
        let timer = null;

        function finish(result) {
            if (done) return;
            done = true;
            try { window.removeEventListener("JKH_UI_STATE_CHANGED", check); } catch(e) {}
            if (timer) clearInterval(timer);
            resolve(result);
        }

        function check() {
            if (!isServerFirstReady()) {
                if (Date.now() - started >= timeoutMs) finish(null);
                return;
            }
            finish(getAbonentFromData(id));
        }

        try { window.addEventListener("JKH_UI_STATE_CHANGED", check); } catch(e) {}
        timer = setInterval(check, 100);
        check();
    });
}

function calcPeriodKey(id){ return "calc_period_" + id; }
function reportPeriodKey(id){ return "report_period_" + id; }
function storeGet(key){ try { return (window.JKHStore && JKHStore.getRaw) ? JKHStore.getRaw(key) : null; } catch { return null; } }
function storeSet(key, value){ try { if (window.JKHStore && JKHStore.setRaw) JKHStore.setRaw(key, value); } catch {} }

function fillAbonentCardHeader(id, a) {
    if (!id) { showMissingAbonentError(); return false; }
    if (!a) { showAbonentNotFoundError(); return false; }

    document.getElementById("abonentTitle").textContent = "Общие данные " + (a.fio || "");

    const fioParts = (a.fio || "").split(" ");
    const last = fioParts[0] || "";
    const name = fioParts[1] || "";
    const mid  = fioParts[2] || "";

    document.getElementById("abonentInfoBody").innerHTML = `
      <tr>
        <td>${id}</td>
        <td>${a.regnum || ""}</td>
        <td>${last}</td>
        <td>${name}</td>
        <td>${mid}</td>
        <td>${a.square ?? ""}</td>
        <td>${a.share ?? ""}</td>
        <td>${a.rooms ?? ""}</td>
        <td>${a.city ?? ""}</td>
        <td>${a.street ?? ""}</td>
        <td>${a.house ?? ""}</td>
        <td>${a.flat ?? ""}</td>
        <td>${a.uid ?? ""}</td>
        <td>${a.phone ?? ""}</td>
      </tr>
    `;

    setBackLink(id);
    return true;
}

function loadAutoPeriod() {
    const id = getAbonentIdFromURL();
    if (!id) return;
    const fromEl = document.getElementById("repFrom");
    const toEl = document.getElementById("repTo");

    try {
        const rawR = storeGet(reportPeriodKey(id));
        if (rawR) {
            const p = JSON.parse(rawR);
            fromEl.value = p.from || "";
            toEl.value   = p.to || "";
            return;
        }
    } catch {}

    try {
        const raw = storeGet(calcPeriodKey(id));
        if (!raw) { fromEl.value = ""; toEl.value = ""; return; }
        const p = JSON.parse(raw);
        fromEl.value = p.from || "";
        toEl.value   = p.to || "";
    } catch {
        fromEl.value = "";
        toEl.value = "";
    }
}

function isValidPeriod(from, to){
    if (!from || !to) return false;
    const a = new Date(from), b = new Date(to);
    return a.toString() !== "Invalid Date" && b.toString() !== "Invalid Date" && a <= b;
}

function saveReportPeriod(from, to){
    const id = getAbonentIdFromURL();
    if (!id) return;
    storeSet(reportPeriodKey(id), JSON.stringify({from: from || "", to: to || ""}));
}

async function initReportsPage() {
    const id = getAbonentIdFromURL();
    if (!id) { showMissingAbonentError(); return; }
    setBackLink(id);

    const abonent = await waitForServerFirstAbonent(id, 10000);
    if (!fillAbonentCardHeader(id, abonent)) return;
    loadAutoPeriod();

    document.getElementById("repChooseBtn").addEventListener("click", () => {
        const from = document.getElementById("repFrom").value;
        const to   = document.getElementById("repTo").value;

        if (!isValidPeriod(from, to)) {
            saveReportPeriod("", "");
            alert("Период не выбран.");
            return;
        }
        saveReportPeriod(from, to);
        alert("Период для справки выбран: " + from + " — " + to);
    });

    document.getElementById("openReport01").addEventListener("click", () => {
        const id = getAbonentIdFromURL();
        if (!id) { showMissingAbonentError(); return; }

        let dbKey = "";
        try{
            const p = new URLSearchParams(location.search);
            dbKey = String(p.get("db") || "").trim();
        }catch(e){ dbKey = ""; }
        const from = document.getElementById("repFrom").value;
        const to   = document.getElementById("repTo").value;

        if (isValidPeriod(from, to)) saveReportPeriod(from, to);
        else saveReportPeriod("", "");

        let href = "spravka_sud.html?abonent=" + encodeURIComponent(id) + "&from=" + encodeURIComponent(from || "") + "&to=" + encodeURIComponent(to || "");
        if (dbKey) href += "&db=" + encodeURIComponent(dbKey);
        location.href = href;
    });
}

document.addEventListener("DOMContentLoaded", () => {
    initReportsPage().catch((e) => {
        try { console.error("[reports] init failed", e); } catch(_) {}
        if (getAbonentIdFromURL()) showAbonentNotFoundError();
        else showMissingAbonentError();
    });
});
</script>

<script>closeLayout();</script>
</body>
</html>
