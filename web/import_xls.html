<script>
function $(id){ return document.getElementById(id); }
function normStr(v){ return String(v==null?'':v).trim(); }
function lowKey(s){
  return normStr(s).toLowerCase().replace(/ё/g,'е').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
}
function normNum(v){
  if (v==null) return NaN;
  let s = String(v).trim();
  if (!s) return NaN;
  s = s.replace(/\s+/g,'').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}
function toFio(fam,name,otch){ return [fam,name,otch].map(normStr).filter(Boolean).join(' '); }
function asSquare(v){ return Number.isFinite(v) ? v : ''; }
function genUID(){ return 'UID_' + String(Date.now()) + '_' + String(Math.floor(Math.random()*10000)).padStart(4,'0'); }
function genTempRegnum(){ return 'TEMP-' + String(Date.now()) + '-' + String(Math.floor(Math.random()*10000)).padStart(4,'0'); }
function pad2(v){ return String(v).padStart(2, '0'); }

function normalizePeriod(v){
  const s = normStr(v);
  if (!s) return null;
  let mm='', yy='';
  let m = s.match(/^(\d{1,2})[.\/-](\d{4})$/);
  if (m){ mm=String(+m[1]).padStart(2,'0'); yy=m[2]; }
  if (!yy){
    m = s.match(/^(\d{4})[.\/-](\d{1,2})$/);
    if (m){ yy=m[1]; mm=String(+m[2]).padStart(2,'0'); }
  }
  if (!yy && /^\d+(\.\d+)?$/.test(s)){
    try{
      const dc = XLSX.SSF.parse_date_code(Number(s));
      if (dc && dc.y && dc.m){ yy=String(dc.y); mm=String(dc.m).padStart(2,'0'); }
    }catch(e){}
  }
  if (!yy || !mm) return null;
  const mNum = Number(mm);
  if (mNum < 1 || mNum > 12) return null;
  return { period: yy + '-' + mm, date: yy + '-' + mm + '-01', display: mm + '.' + yy };
}

function normalizePaidDate(v){
  if (v==null) return '';
  const s = normStr(v);
  if (!s) return '';
  if (/^\d+(\.\d+)?$/.test(s)){
    try{
      const dc = XLSX.SSF.parse_date_code(Number(s));
      if (dc && dc.y && dc.m && dc.d){
        return String(dc.d).padStart(2,'0') + '.' + String(dc.m).padStart(2,'0') + '.' + String(dc.y);
      }
    }catch(e){}
  }
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return m[3] + '.' + m[2] + '.' + m[1];
  m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (m) return m[1] + '.' + m[2] + '.' + m[3];
  const per = normalizePeriod(s);
  if (per) return '01.' + per.period.slice(5,7) + '.' + per.period.slice(0,4);
  return s;
}

function canWriteOrExplain(){
  try{ if (window.Data && typeof Data.ensureWriteOrExplain === 'function') return Data.ensureWriteOrExplain(); }catch(e){}
  try{
    if (window.JKHStore && typeof JKHStore.canWriteNow === 'function' && !JKHStore.canWriteNow()){
      $('writeWarning').innerHTML = '<span class="danger">Запись запрещена:</span> гостевой режим или ALL-mode.';
      return false;
    }
  }catch(e){}
  return true;
}
function refreshWho(){
  try{ $('whoInfo').textContent = 'База: ' + (JKHStore.getOwnerId ? JKHStore.getOwnerId() : '—'); }
  catch(e){ $('whoInfo').textContent = 'База: —'; }
}

function getDB(){ return window.AbonentsDB || null; }
function saveDB(){ try{ if (typeof window.saveAbonentsDB === 'function') return window.saveAbonentsDB(); }catch(e){} }
function payKey(ls){ return 'payments_' + String(ls); }
function getPaymentsByLS(ls){
  try{ return (window.JKHStore && JKHStore.getJSON) ? (JKHStore.getJSON(payKey(ls), [], null) || []) : []; }
  catch(e){ return []; }
}
function setPaymentsByLS(ls, arr){ if (!window.JKHStore || !JKHStore.setJSON) throw new Error('Нет JKHStore.setJSON'); return JKHStore.setJSON(payKey(ls), arr, null); }

function parseYearMonthFromAny(v){
  const s = normStr(v);
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{2})(?:-\d{2})?$/);
  if (m) return { year: m[1], month: m[2] };
  m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (m) return { year: m[3], month: m[2] };
  return null;
}

function getLedgerYearMonth(row){
  if (!row || typeof row !== 'object') return null;
  const y = normStr(row.year);
  const m = normStr(row.month);
  if (/^\d{4}$/.test(y) && /^\d{1,2}$/.test(m)){
    const mn = Number(m);
    if (mn >= 1 && mn <= 12) return { year: y, month: pad2(mn) };
  }
  return parseYearMonthFromAny(row.date || row.paid_date || '');
}

function getLedgerPaidDate(row){
  if (!row || typeof row !== 'object') return '';
  return normStr(row.paid_date || row.date || '');
}

function getLedgerPaidAmount(row){
  if (!row || typeof row !== 'object') return NaN;
  const p = normNum(row.paid);
  if (Number.isFinite(p)) return p;
  return normNum(row.amount);
}

function buildImportedPaymentLedgerRow(list, per, amount){
  let maxId = 0;
  for (let i=0;i<list.length;i++){
    const idNum = Number(list[i] && list[i].id);
    if (Number.isFinite(idNum) && idNum > maxId) maxId = idNum;
  }
  return {
    id: maxId + 1,
    year: per.period.slice(0, 4),
    month: per.period.slice(5, 7),
    accrued: 0,
    paid: amount,
    paid_date: '01.' + per.period.slice(5, 7) + '.' + per.period.slice(0, 4),
    source: 'Импорт Excel',
    payment_period: ''
  };
}

function sortLedgerRows(list){
  list.sort(function(a,b){
    const aYM = getLedgerYearMonth(a);
    const bYM = getLedgerYearMonth(b);
    const aKey = aYM ? (aYM.year + '-' + aYM.month) : '0000-00';
    const bKey = bYM ? (bYM.year + '-' + bYM.month) : '0000-00';
    if (aKey !== bKey) return aKey.localeCompare(bKey);
    return Number(a && a.id || 0) - Number(b && b.id || 0);
  });
}



function deepCloneJSONSafe(obj){
  try{ return JSON.parse(JSON.stringify(obj)); }catch(e){ return null; }
}

function capturePaymentsSnapshot(db, rows){
  const snap = {};
  if (!db || !db.abonents || !Array.isArray(rows)) return snap;
  for (let i=0;i<rows.length;i++){
    const uid = normStr(rows[i] && rows[i].uid);
    const foundU = uid ? findAbonentByUid(db, uid) : null;
    const ab = foundU ? foundU.abonent : null;
    if (!ab) continue;
    const ls = normStr(ab.id);
    if (!ls || Object.prototype.hasOwnProperty.call(snap, ls)) continue;
    snap[ls] = deepCloneJSONSafe(getPaymentsByLS(ls)) || [];
  }
  return snap;
}

function restorePaymentsSnapshot(paymentsSnapshot){
  if (!paymentsSnapshot || typeof paymentsSnapshot !== 'object') return;
  const keys = Object.keys(paymentsSnapshot);
  for (let i=0;i<keys.length;i++){
    const ls = keys[i];
    setPaymentsByLS(ls, Array.isArray(paymentsSnapshot[ls]) ? paymentsSnapshot[ls] : []);
  }
}

async function rollbackAfterFlushError(snapshot, options){
  try{
    if (snapshot && snapshot.db && typeof window.AbonentsDB === 'object'){
      window.AbonentsDB = deepCloneJSONSafe(snapshot.db) || snapshot.db;
      if (typeof window.saveAbonentsDB === 'function') window.saveAbonentsDB();
    }
    if (snapshot && snapshot.payments){
      restorePaymentsSnapshot(snapshot.payments);
    }
  }catch(e){
    console.warn('Local rollback failed', e);
  }

  try{
    if (window.JKHDataLoader && typeof window.JKHDataLoader.loadFromServer === 'function'){
      await window.JKHDataLoader.loadFromServer({ force: true, reason: (options && options.reason) || 'import_flush_error_rollback' });
    }
  }catch(e){
    console.warn('Forced project reload failed', e);
  }

  if (!options || options.reload !== false){
    try{ window.location.reload(); }catch(e){}
  }
}

// --- CANON FIX: база ключуется по ЛС (db.abonents[LS]), UID хранится в поле abonent.uid.
// Поэтому везде, где нужен поиск по UID, используем эту функцию (case-insensitive).
function findAbonentByUid(db, uid){
  const u = normStr(uid);
  if (!u || !db || !db.abonents) return null;

  // legacy: если вдруг UID был ключом
  if (db.abonents[u]) return { key:u, abonent: db.abonents[u] };

  const uLow = u.toLowerCase();
  const keys = Object.keys(db.abonents || {});
  for (let i=0;i<keys.length;i++){
    const k = keys[i];
    const a = db.abonents[k];
    if (!a) continue;
    const au = normStr(a.uid);
    if (au && au.toLowerCase() === uLow) return { key:k, abonent:a };
  }
  return null;
}

function saveDraftNewAbonent(row){
  if (!window.JKHStore || !JKHStore.setJSON) return false;
  const draft = {

}
function tryResumeFromHash(){
  if (location.hash !== '#resume=1') return false;
  const resume = loadImportResumeState();
  if (!resume) return false;

  if ((!Array.isArray(dataRows) || !dataRows.length) && Array.isArray(resume.dataRows) && resume.dataRows.length){
    dataRows = resume.dataRows;
    primaryApplied = !!resume.primaryApplied;
    primaryBlocked = !!resume.primaryBlocked;
    mode = resume.mode === 'payments' ? 'payments' : 'primary';
    conflictDecision = resume.conflictDecision || {};
  }

  const db = getDB();
  const target = Number(resume.targetExcelRow) || 0;
  if (db && db.abonents && target){
    const row = dataRows.find(x => Number(x.excelRow)===target);
    if (row){
      const found = findAbonentByRules(db, row);
      if (found && found.abonent){
        row.uid = normStr(found.abonent.uid || row.uid);
      }
    }
  }

  if (Array.isArray(dataRows) && dataRows.length){
    buildPreview();
    saveImportDraftState();
  }
  if (target){
    alert('Возврат из создания абонента: строка Excel #' + target + ' восстановлена. Можно продолжить импорт.');
  }
  clearImportResumeState();
  history.replaceState(null, '', location.pathname + location.search);
  return true;
}

function findHeaderRow(aoa){
  const maxScan = Math.min(80, aoa.length);
  for (let r=0; r<maxScan; r++){
    const row = aoa[r] || [];
    let hasUID=false, hasLS=false, hasFam=false, hasSq=false;
    for (let c=0;c<row.length;c++){
      const k = lowKey(row[c]);
      if (!k) continue;
      if (k === 'uid' || k === 'уид' || k.includes('уникальный идентификатор')) hasUID = true;
      if (k === 'лс' || k.includes('лицевой счет') || k.includes('лицевой счёт')) hasLS = true;
      if (k === 'фамилия' || k === 'фам') hasFam = true;
      if (k.includes('площад')) hasSq = true;
    }
    if ((hasUID || (hasLS && hasFam)) && hasSq) return r;
  }
  return -1;
}
function findPaymentPairs(hdrRow){
  function isAmountHeader(v){
    const k = lowKey(v);
    if (!k) return false;
    if (k === 'сумма') return true;
    if (k === 'оплата') return true;
    if (k === 'сумма оплаты') return true;
    if (k === 'п п сумма') return true;
    if (k.includes('сумма оплаты')) return true;
    if (k.includes('п п сумма')) return true;
    if (k.includes('оплата')) return true;
    if (k.includes('сумма')) return true;
    return false;
  }
  function isDateHeader(v){
    const k = lowKey(v);
    if (!k) return false;
    if (k === 'дата') return true;
    if (k === 'дата оплаты') return true;
    if (k.includes('дата оплаты')) return true;
    if (k.includes('дата')) return true;
    if (k === 'период' || k.includes('период')) return true;
    if (k === 'месяц' || k.includes('месяц')) return true;
    return false;
  }
  function isSkippableBetween(v){
    const k = lowKey(v);
    if (!k) return true;
    if (k === '№' || k === 'no' || k === 'n') return true;
    if (k === 'примечание' || k === 'комментарий') return true;
    return false;
  }
  function pushPairUnique(pairs, sumCol, periodCol){
    for (let i=0;i<pairs.length;i++){
      if (pairs[i].sumCol===sumCol && pairs[i].periodCol===periodCol) return;
    }
    pairs.push({ sumCol:sumCol, periodCol:periodCol });
  }

  const pairs = [];
  const usedSum = {};
  const usedPeriod = {};

  // 1) Приоритет — соседние пары (без изменений текущих шаблонов).
  for (let c=0;c<hdrRow.length-1;c++){
    const left = hdrRow[c];
    const right = hdrRow[c+1];
    if (isAmountHeader(left) && isDateHeader(right) && !usedSum[c] && !usedPeriod[c+1]){
      pushPairUnique(pairs, c, c+1);
      usedSum[c] = true;
      usedPeriod[c+1] = true;
      continue;
    }
    if (isDateHeader(left) && isAmountHeader(right) && !usedSum[c+1] && !usedPeriod[c]){
      pushPairUnique(pairs, c+1, c);
      usedSum[c+1] = true;
      usedPeriod[c] = true;
    }
  }

  // 2) Fallback — окно 2-3 колонок, только через один пустой/служебный столбец.
  for (let c=0;c<hdrRow.length;c++){
    if (usedSum[c] || !isAmountHeader(hdrRow[c])) continue;

    for (let d=1;d<=2;d++){
      const p = c + d;
      if (p >= hdrRow.length) break;
      if (usedPeriod[p]) continue;
      if (!isDateHeader(hdrRow[p])) continue;
      if (d === 1 || isSkippableBetween(hdrRow[c+1])){
        pushPairUnique(pairs, c, p);
        usedSum[c] = true;
        usedPeriod[p] = true;
        break;
      }
    }
    if (usedSum[c]) continue;
    for (let d2=1;d2<=2;d2++){
      const p2 = c - d2;
      if (p2 < 0) break;
      if (usedPeriod[p2]) continue;
      if (!isDateHeader(hdrRow[p2])) continue;
      if (d2 === 1 || isSkippableBetween(hdrRow[c-1])){
        pushPairUnique(pairs, c, p2);
        usedSum[c] = true;
        usedPeriod[p2] = true;
        break;
      }
    }
  }
  return pairs;
}


function toFieldNo(v){
  if (v==null) return NaN;
  if (typeof v === 'number') return Number.isFinite(v) ? Math.round(v) : NaN;
  const s = normStr(v).replace(',', '.');
  if (!s) return NaN;
  if (!/^\d+(\.0+)?$/.test(s)) return NaN;
  return Math.round(Number(s));
}
function findIndexMapRow(aoa){
  if (!Array.isArray(aoa) || !aoa.length) return -1;
  const maxScan = Math.min(40, aoa.length);
  let bestIndex = -1, bestScore = -1;
  for (let r=0; r<maxScan; r++){
    const row = aoa[r] || [];
    if (!row.length) continue;
    const seen = {};
    let inRange = 0, seqHits = 0;
    for (let c=0;c<row.length;c++){
      const n = toFieldNo(row[c]);
      if (!Number.isFinite(n)) continue;
      if (n < 1 || n > 120) continue;
      inRange++;
      seen[n] = true;
    }
    const uniq = Object.keys(seen).length;
    if (!uniq) continue;
    for (let n=1;n<=15;n++) if (seen[n]) seqHits++;
    const score = (inRange * 2) + uniq + (seqHits * 3);
    if (inRange >= 10 && uniq >= 10 && score > bestScore){
      bestScore = score;
      bestIndex = r;
    }
  }
  return bestIndex;
}
function buildColumnIndexMap(indexRow){
  const map = {};
  const row = Array.isArray(indexRow) ? indexRow : [];
  for (let c=0;c<row.length;c++){
    const n = toFieldNo(row[c]);
    if (!Number.isFinite(n)) continue;
    if (n < 1 || n > 120) continue;
    if (!Object.prototype.hasOwnProperty.call(map, n)) map[n] = c;
  }
  return map;
}
function getCellByFieldNo(line, fieldMap, fieldNo){
  if (!line || !fieldMap) return '';
  const col = fieldMap[fieldNo];
  if (!Number.isInteger(col) || col < 0) return '';
  return line[col];
}
function firstNonEmptyField(line, fieldMap, fieldNos){
  const list = Array.isArray(fieldNos) ? fieldNos : [];
  for (let i=0;i<list.length;i++){
    const v = getCellByFieldNo(line, fieldMap, list[i]);
    if (normStr(v)!=='') return v;
  }
  return '';
}
function parseSheetToRowsByFieldMap(aoa, fieldMap, indexRowIndex){
  if (!Array.isArray(aoa) || !fieldMap || !Number.isInteger(indexRowIndex)) return { ok:false, msg:'Некорректные параметры field-map парсинга.' };
  const required = [10,11,12];
  const hasRequired = required.some(function(no){ return Number.isInteger(fieldMap[no]); });
  if (!hasRequired) return { ok:false, msg:'В служебной строке не найдены поля оплаты (10/11/12).' };

  const rows = [];
  for (let r=indexRowIndex+1; r<aoa.length; r++){
    const line = aoa[r] || [];
    if (line.every(c => normStr(c)==='')) continue;

    const uidVal = firstNonEmptyField(line, fieldMap, [1,6,7,8,9]);
    const lsVal = firstNonEmptyField(line, fieldMap, [2,3,4,5]);
    const famVal = firstNonEmptyField(line, fieldMap, [13,14,15,16]);
    const nameVal = firstNonEmptyField(line, fieldMap, [17,18,19]);
    const otchVal = firstNonEmptyField(line, fieldMap, [20,21,22]);
    const sqVal = firstNonEmptyField(line, fieldMap, [23,24,25,26,27]);

    const pAmount = getCellByFieldNo(line, fieldMap, 10);
    const pDate = getCellByFieldNo(line, fieldMap, 11);
    const pPeriod = getCellByFieldNo(line, fieldMap, 12);
    const payments = [{ amount: pAmount, periodRaw: normStr(pPeriod) || pDate, paidDateRaw: pDate }];

    if (!normStr(uidVal) && !normStr(lsVal) && !normStr(famVal) && !normStr(nameVal) && !normStr(otchVal) &&
        !Number.isFinite(normNum(sqVal)) && !normStr(pAmount) && !normStr(pDate) && !normStr(pPeriod)){
      continue;
    }

    rows.push({
      excelRow:r+1,
      uid:normStr(uidVal),
      ls:normStr(lsVal),
      fam:normStr(famVal),
      name:normStr(nameVal),
      otch:normStr(otchVal),
      square:normNum(sqVal),
      squareRaw:sqVal,
      payments
    });
  }
  return { ok:true, rows };
}

function createAbonentMinimal(db, desiredUid, ls, fam, name, otch, square){
  const lsKey = normStr(ls);
  if (!lsKey) return { ok:false, msg:'Пустой ЛС — нельзя создать абонента.' };

  // UID: принимаем как есть (UID_/uid_ и т.п.). Если пусто — генерируем.
  const uid = desiredUid ? String(desiredUid).trim() : genUID();

  // Канон: ключуем абонентов по ЛС (а не по UID), иначе в таблицах "ЛС" превращается в UID.
  if (db.abonents[lsKey]) return { ok:false, msg:'ЛС уже существует (конфликт): ' + lsKey };

  const regnum = genTempRegnum();
  db.abonents[lsKey] = {
    id: lsKey,
    uid: uid,
    fio: toFio(fam,name,otch),
    fam: normStr(fam),
    name: normStr(name),
    otch: normStr(otch),
    square: Number.isFinite(square) ? square : '',
    regnum: regnum,
    premiseRegnum: regnum,
    city:'', street:'', house:'', flat:'', rooms:'', share:'',
    calcStartDate:'', calcEndDate:'',
    premiseCreatedAt:'2000-01-01'
  };
  return { ok:true, uid: uid, abonent: db.abonents[lsKey] };
}

function findAbonentByRules(db, row){
  const uid = normStr(row.uid), ls = normStr(row.ls), fam = normStr(row.fam);
  if (uid){
    const foundU = findAbonentByUid(db, uid);
    if (foundU && foundU.abonent) return { type:'UID_OK', key:foundU.key, abonent:foundU.abonent, uid: normStr(foundU.abonent.uid || uid) };
    return { type:'UID_MISSING', msg:'UID из Excel не найден в базе. Нельзя применить первичку.' };
  }
  if (!ls || !fam) return { type:'NO_ID', msg:'Нет ЛС/Фамилии — идентификация невозможна.' };

  const hits = [];
  const keys = Object.keys(db.abonents || {});
  for (let i=0;i<keys.length;i++){
    const k = keys[i], a = db.abonents[k];
    if (!a) continue;
    if (normStr(a.id)===ls && normStr(a.fam).toLowerCase()===fam.toLowerCase()) hits.push({ key:k, abonent:a });
  }
  if (hits.length === 1){
    const h = hits[0];
    return { type:'FOUND_BY_LS_FAM', key:h.key, abonent:h.abonent, uid:normStr(h.abonent.uid || h.key) };
  }
  if (hits.length === 0) return { type:'NOT_FOUND', msg:'Абонент не найден. Можно создать (если включено "Разрешить создание абонента").' };
  return { type:'AMBIG', msg:'Неоднозначность: найдено ' + hits.length + ' абонента(ов) по ЛС+Фамилии.' };
}

function migrateKeyToUID(db, oldKey, newUid){
  const a = db.abonents[oldKey];
  if (!a) return { ok:false, msg:'Абонент не найден для миграции ключа.' };
  if (oldKey === newUid){ a.uid = newUid; return { ok:true, key:newUid, abonent:a }; }
  if (db.abonents[newUid]) return { ok:false, msg:'Нельзя присвоить UID: ключ уже занят.' };
  db.abonents[newUid] = a;
  delete db.abonents[oldKey];
  db.abonents[newUid].uid = newUid;
  return { ok:true, key:newUid, abonent:db.abonents[newUid] };
}

let WB=null, aoa=null, headerRowIndex=-1, payPairs=[], dataRows=[];
let parseMeta={ mode:'none', indexRowIndex:-1 };
let mode='primary';
let primaryApplied=false;
let primaryBlocked=false;
let conflictDecision={};
let preview=[];
let currentFileName='';
let restoredFromDraft=false;

function paymentPairsCount(row){
  if (!Array.isArray(row && row.payments)) return 0;
  return row.payments.filter(function(x){
    return !!(normStr(x && x.amount) || normStr(x && x.periodRaw));
  }).length;
}

function parseSheetToRows(sheet){
  aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  parseMeta = { mode:'none', indexRowIndex:-1 };

  const indexRowIndex = findIndexMapRow(aoa);
  if (indexRowIndex >= 0){
    const indexRow = aoa[indexRowIndex] || [];
    const fieldMap = buildColumnIndexMap(indexRow);
    const mapped = parseSheetToRowsByFieldMap(aoa, fieldMap, indexRowIndex);
    if (mapped && mapped.ok){
      headerRowIndex = indexRowIndex;
      payPairs = Number.isInteger(fieldMap[10]) ? [{ sumCol: fieldMap[10], periodCol: Number.isInteger(fieldMap[12]) ? fieldMap[12] : fieldMap[11] }] : [];
      parseMeta = { mode:'field-map', indexRowIndex:indexRowIndex };
      return mapped;
    }
  }

  headerRowIndex = findHeaderRow(aoa);
  if (headerRowIndex < 0) return { ok:false, msg:'Не нашёл строку заголовков (UID/ЛС/Фамилия/Площадь).' };

  const hdrRow = aoa[headerRowIndex] || [];
  payPairs = findPaymentPairs(hdrRow);

  const idxUID = hdrRow.findIndex(x => lowKey(x)==='uid' || lowKey(x)==='уид');
  const idxLS  = hdrRow.findIndex(x => lowKey(x)==='лс' || lowKey(x).includes('лицевой'));
  const idxFAM = hdrRow.findIndex(x => lowKey(x)==='фамилия' || lowKey(x)==='фам');
  const idxNAM = hdrRow.findIndex(x => lowKey(x)==='имя');
  const idxOTC = hdrRow.findIndex(x => lowKey(x)==='отчество');
  const idxSQ  = hdrRow.findIndex(x => lowKey(x).includes('площад'));

  if (idxFAM < 0) return { ok:false, msg:'Не найдена колонка "Фамилия".' };
  if (idxSQ < 0) return { ok:false, msg:'Не найдена колонка "Общая площадь".' };
  if (idxLS < 0 && idxUID < 0) return { ok:false, msg:'Не найдены колонки UID или ЛС.' };

  const rows = [];
  for (let r=headerRowIndex+1; r<aoa.length; r++){
    const line = aoa[r] || [];
    if (line.every(c => normStr(c)==='')) continue;

    const payments = [];
    for (let i=0;i<payPairs.length;i++) payments.push({ amount: line[payPairs[i].sumCol], periodRaw: line[payPairs[i].periodCol] });

    rows.push({
      excelRow:r+1,
      uid:(idxUID>=0)?normStr(line[idxUID]):'',
      ls:(idxLS>=0)?normStr(line[idxLS]):'',
      fam:normStr(line[idxFAM]),
      name:(idxNAM>=0)?normStr(line[idxNAM]):'',
      otch:(idxOTC>=0)?normStr(line[idxOTC]):'',
      square:normNum(line[idxSQ]),
      squareRaw:line[idxSQ],
      payments
    });
  }
  parseMeta = { mode:'headers', indexRowIndex:-1 };
  return { ok:true, rows };
}

function evaluatePrimaryRow(db, row){
  const messages = [], warnings = [];
  let status='OK', critical=false, action=null;
  const found = findAbonentByRules(db, row);

  if (!Number.isFinite(row.square) || row.square <= 0){
    status='ERROR'; critical=true; messages.push('Ошибки: "Общая площадь" должна быть числом > 0.');
  }

  if (found.type === 'UID_MISSING' || found.type === 'NO_ID' || found.type === 'AMBIG'){
    status='ERROR'; critical=true; messages.push(found.msg);
  } else if (found.type === 'NOT_FOUND'){
    status='ERROR'; critical=true; messages.push(found.msg);
    if (!normStr(row.uid)) action = { type:'ADD_ABONENT' };
    if (!normStr(row.ls) || !normStr(row.fam)) messages.push('Для создания нужны непустые ФИО/ЛС.');
  } else if (found.type === 'FOUND_BY_LS_FAM'){
    status='UPDATED';
    warnings.push('Абонент найден по ЛС/Фамилии. UID будет присвоен при применении первички.');
  }

  if (found.abonent){
    const dbSq = normNum(found.abonent.square);
    if (Number.isFinite(dbSq) && Number.isFinite(row.square) && dbSq !== row.square){
      status = (status==='ERROR') ? 'ERROR' : 'UPDATED';
      warnings.push('ПРЕДУПРЕЖДЕНИЕ: в базе площадь=' + dbSq + '; в Excel площадь=' + row.square + ' — при применении будет обновлена.');
    }
  }

  if (!messages.length && !warnings.length) messages.push('Строка готова к применению.');
  return { status, critical, action, found, details: messages.concat(warnings) };
}

function evaluatePaymentsRow(db, row){
  const details = [];
  let status='OK', critical=false;
  const uid = normStr(row.uid);
  const foundU = uid ? findAbonentByUid(db, uid) : null;
  const ab = foundU ? foundU.abonent : null;

  if (!uid || !ab){
    return { status:'ERROR', critical:true, details:['Платежи импортируются только по UID после шага 1.'], conflicts:0, unresolved:0 };
  }

  const ls = normStr(ab.id);
  const existing = getPaymentsByLS(ls);
  let conflicts=0, unresolved=0, errs=0, dups=0, adds=0;

  for (let i=0;i<row.payments.length;i++){
    const p = row.payments[i];
    const amountRaw = normStr(p.amount), periodRaw = normStr(p.periodRaw);
    if (!amountRaw && !periodRaw) continue;

    const amount = normNum(p.amount);
    const per = normalizePeriod(p.periodRaw);

    if (!per || !Number.isFinite(amount) || amount <= 0){
      errs++;
      continue;
    }

    const dup = existing.some(function(x){
      const ym = getLedgerYearMonth(x);
      const paid = getLedgerPaidAmount(x);
      const paidDate = getLedgerPaidDate(x);
      if (!ym || !Number.isFinite(paid)) return false;
      return ym.year === per.period.slice(0,4) &&
        ym.month === per.period.slice(5,7) &&
        paidDate === ('01.' + per.period.slice(5,7) + '.' + per.period.slice(0,4)) &&
        paid === amount;
    });
    if (dup){ dups++; continue; }

    const sameMonthPayment = existing.find(function(x){
      const ym = getLedgerYearMonth(x);
      const paid = getLedgerPaidAmount(x);
      if (!ym || !Number.isFinite(paid) || paid <= 0) return false;
      return ym.year === per.period.slice(0,4) && ym.month === per.period.slice(5,7);
    });
    if (sameMonthPayment){
      conflicts++;
      const key = ls + '::' + per.period;
      if (!conflictDecision[key]) unresolved++;
      continue;
    }
    adds++;
  }

  if (errs>0){ status='ERROR'; critical=true; details.push('Есть ошибки платежей: нужна корректная дата/период и сумма > 0.'); }
  if (conflicts>0){ status = (status==='ERROR' ? status : 'CONFLICT'); details.push('КОНФЛИКТ: есть существующие платежи за тот же период. Выбери действие.'); }
  if (!errs && !conflicts && adds===0 && dups>0){ status='SKIP_DUPLICATE'; details.push('Найдены только дубликаты — будут пропущены.'); }
  if (!errs && !conflicts && adds>0){ status='OK'; details.push('Строка платежей готова к применению.'); }
  if (!errs && !conflicts && adds===0 && dups===0){ details.push('Платежей в строке нет.'); }

  return { status, critical, details, conflicts, unresolved };
}

function buildPreview(){
  const db = getDB();
  preview = [];
  primaryBlocked = false;

  if (!db || !db.abonents){
    preview = [{ excelRow:'—', uid:'', ls:'', fio:'', square:'', paymentsBrief:'—', status:'ERROR', details:['База абонентов не загружена (AbonentsDB отсутствует).'], critical:true }];
    renderPreview();
    return;
  }

  let noUidCount = 0;

  for (let i=0;i<dataRows.length;i++){
    const r = dataRows[i];
    if (!normStr(r.uid)) noUidCount++;

    const p1 = evaluatePrimaryRow(db, r);
    if (p1.critical) primaryBlocked = true;

    if (mode === 'primary'){
      preview.push({
        excelRow:r.excelRow, uid:normStr(r.uid), ls:normStr(r.ls), fio:toFio(r.fam,r.name,r.otch),
        square:asSquare(r.square), paymentsBrief: paymentPairsCount(r) ? (paymentPairsCount(r) + ' пар') : '—',
        status:p1.status, critical:p1.critical, action:p1.action, details:p1.details
      });
    } else {
      const p2 = evaluatePaymentsRow(db, r);
      preview.push({
        excelRow:r.excelRow, uid:normStr(r.uid), ls:normStr(r.ls), fio:toFio(r.fam,r.name,r.otch),
        square:asSquare(r.square), paymentsBrief: paymentPairsCount(r) ? (paymentPairsCount(r) + ' пар') : '—',
        status:p2.status, critical:p2.critical, details:p2.details
      });
    }
  }

  $('uidHint').innerHTML = noUidCount > 0 ? 'Найдено строк без UID: <b>' + noUidCount + '</b>. Нажмите "Создать абонента" в нужной строке.' : 'Строк без UID не найдено.';
  renderPreview();
}

function statusRU(s){ return ({OK:'ОК', ERROR:'ОШИБКА', UPDATED:'ПРЕДУПРЕЖДЕНИЕ', SKIP_DUPLICATE:'ДУБЛИКАТ', CONFLICT:'КОНФЛИКТ'})[s] || s; }
function statusClass(s){ return ({OK:'status-ok', ERROR:'status-err', UPDATED:'status-upd', SKIP_DUPLICATE:'status-skip', CONFLICT:'status-conflict'})[s] || ''; }

function renderPreview(){
  const body = $('previewBody');
  body.innerHTML = '';
  if (!preview.length){ body.innerHTML = '<tr><td colspan="7" class="small">Нет предпросмотра</td></tr>'; updateRestoredFileInfo(); updateStateLine(); setButtons(); return; }

  let ok=0, err=0, warn=0, dup=0, conf=0;
  for (let i=0;i<preview.length;i++){
    const r = preview[i];
    if (r.status==='OK') ok++;
    if (r.status==='ERROR') err++;
    if (r.status==='UPDATED') warn++;
    if (r.status==='SKIP_DUPLICATE') dup++;
    if (r.status==='CONFLICT') conf++;

    let actionsHTML = '';
    if (mode==='primary' && r.action && r.action.type==='ADD_ABONENT'){
      const allow = $('optAllowCreate').checked;
      actionsHTML = '<button class="action-btn" data-act="add" data-excelrow="' + r.excelRow + '" ' + (allow?'':'disabled') + '>Создать абонента</button>' +
        '<span class="small ' + (allow?'':'danger') + '">' + (allow?'':'Включи "Разрешить создание абонента"') + '</span>';
    }

    if (mode==='payments' && r.status==='CONFLICT'){
      const db = getDB();
      const rr = dataRows.find(x => x.excelRow===r.excelRow);
      const foundU = (rr && rr.uid && db) ? findAbonentByUid(db, rr.uid) : null;
      const ls = foundU && foundU.abonent ? normStr(foundU.abonent.id) : '';
      if (ls){
        rr.payments.forEach(function(p){
          const per = normalizePeriod(p.periodRaw);
          const amount = normNum(p.amount);
          if (!per || !Number.isFinite(amount) || amount<=0) return;
          const ex = getPaymentsByLS(ls).find(function(x){
            const ym = getLedgerYearMonth(x);
            const paid = getLedgerPaidAmount(x);
            if (!ym || !Number.isFinite(paid) || paid <= 0) return false;
            return ym.year === per.period.slice(0,4) &&
              ym.month === per.period.slice(5,7) &&
              !(getLedgerPaidDate(x) === ('01.' + per.period.slice(5,7) + '.' + per.period.slice(0,4)) && paid === amount);
          });
          if (!ex) return;
          const key = ls + '::' + per.period;
          const dec = conflictDecision[key] || '';
          actionsHTML += '<div class="small" style="margin-bottom:6px">' + per.display + ': было ' + getLedgerPaidAmount(ex) + ', новое ' + amount + '</div>' +
            '<button class="action-btn" data-act="conf_over" data-key="' + key + '">Принять новый (заменить)</button>' +
            '<button class="action-btn" data-act="conf_keep" data-key="' + key + '">Оставить старый</button>' +
            (dec ? '<div class="small ok">Решение: ' + (dec==='overwrite'?'заменить':'оставить старый') + '</div>' : '');
        });
      }
    }

    const tr = document.createElement('tr');
    tr.className = statusClass(r.status);
    tr.innerHTML = '<td class="mono">' + r.excelRow + '</td>' +
      '<td class="mono">' + (r.uid||'') + '</td>' +
      '<td class="mono">' + (r.ls||'') + '</td>' +
      '<td>' + (r.fio||'') + '</td>' +
      '<td class="mono">' + (r.square!=='' ? r.square : '') + '</td>' +
      '<td class="mono">' + (r.paymentsBrief||'—') + '</td>' +
      '<td><b>' + statusRU(r.status) + '</b><div>' + (r.details||[]).join('<br>') + '</div><div style="margin-top:4px">' + actionsHTML + '</div></td>';
    body.appendChild(tr);
  }

  $('summaryLine').textContent = 'Режим: ' + (mode==='primary'?'Шаг 1 — Первичка':'Шаг 2 — Платежи') +
    ' | ОК=' + ok + ' | ПРЕДУПРЕЖДЕНИЕ=' + warn + ' | ОШИБКА=' + err + ' | ДУБЛИКАТ=' + dup + ' | КОНФЛИКТ=' + conf + ' | Всего=' + preview.length;

  let diag = '';
  if (err){ diag = '<span class="danger">Есть ошибки, проверь строки со статусом ОШИБКА.</span>'; }
  else { diag = '<span class="ok">Критических ошибок в текущем шаге нет.</span>'; }
  if (parseMeta.mode === 'field-map' && Number.isInteger(parseMeta.indexRowIndex) && parseMeta.indexRowIndex >= 0){
    diag += '<br><span class="ok">Платёжные колонки определены по служебной строке №' + (parseMeta.indexRowIndex + 1) + '.</span>';
  } else if (parseMeta.mode === 'headers'){
    diag += '<br><span class="' + ((Array.isArray(payPairs) && payPairs.length>0) ? 'ok' : 'danger') + '">' +
      ((Array.isArray(payPairs) && payPairs.length>0) ? 'Платёжные колонки определены по заголовкам.' : 'Платёжные колонки не распознаны.') + '</span>';
  }
  $('errorsBox').innerHTML = diag;

  updateRestoredFileInfo();
  updateStateLine();
  setButtons();
}

function hasPrimaryCritical(){ return preview.some(r => r.critical && r.status==='ERROR'); }
function hasPaymentsCritical(){ return preview.some(r => r.critical && r.status==='ERROR'); }
function hasUnresolvedConflicts(){
  if (mode !== 'payments') return false;
  for (let i=0;i<dataRows.length;i++){
    const db = getDB();
    const r = dataRows[i];
    const foundU = (!db || !r.uid) ? null : findAbonentByUid(db, r.uid);
    if (!foundU || !foundU.abonent) continue;
    const ls = normStr(foundU.abonent.id);
    const list = getPaymentsByLS(ls);
    for (let p=0;p<r.payments.length;p++){
      const per = normalizePeriod(r.payments[p].periodRaw);
      const amount = normNum(r.payments[p].amount);
      if (!per || !Number.isFinite(amount) || amount<=0) continue;
      const hasConflict = list.some(function(x){
        const ym = getLedgerYearMonth(x);
        const paid = getLedgerPaidAmount(x);
        if (!ym || !Number.isFinite(paid) || paid <= 0) return false;
        return ym.year === per.period.slice(0,4) &&
          ym.month === per.period.slice(5,7) &&
          !(getLedgerPaidDate(x) === ('01.' + per.period.slice(5,7) + '.' + per.period.slice(0,4)) && paid === amount);
      });
      if (hasConflict && !conflictDecision[ls + '::' + per.period]) return true;
    }
  }
  return false;
}

function updateStateLine(){
  if (!dataRows.length){ $('stepStateLine').textContent = 'Шаг 1 не применён. Шаг 2 заблокирован до успешной первички.'; return; }
  if (primaryApplied) $('stepStateLine').textContent = 'Шаг 1 применён успешно. Шаг 2 доступен.';
  else if (primaryBlocked) $('stepStateLine').textContent = 'Шаг 1: заблокирован (есть ошибки). Шаг 2 заблокирован до успешной первички.';
  else $('stepStateLine').textContent = 'Шаг 1 не применён. Шаг 2 заблокирован до успешной первички.';
}

function setButtons(){
  const hasFile = !!$('fileInput').files && $('fileInput').files.length>0;
  $('btnParse').disabled = !hasFile;
  $('btnReset').disabled = !dataRows.length && !preview.length;

  $('btnModePrimary').classList.toggle('active', mode==='primary');
  $('btnModePayments').classList.toggle('active', mode==='payments');

  const canWrite = canWriteOrExplain();
  const parsed = dataRows.length > 0;

  $('btnModePayments').disabled = !(parsed && primaryApplied && !primaryBlocked);
  $('btnApplyPrimary').disabled = !(mode==='primary' && parsed && canWrite && !primaryBlocked);
  $('btnApplyPayments').disabled = !(mode==='payments' && parsed && canWrite && primaryApplied && !hasPaymentsCritical() && !hasUnresolvedConflicts());
}

function updateRestoredFileInfo(){
  const file = normStr(currentFileName);
  $('restoredFileLine').textContent = (restoredFromDraft && file) ? ('Восстановлен предпросмотр из файла: ' + file) : '';
}
function clearRuntimeState(){
  preview=[];
  dataRows=[];
  conflictDecision={};
  primaryApplied=false;
  primaryBlocked=false;
  mode='primary';
  currentFileName='';
  restoredFromDraft=false;
  parseMeta={ mode:'none', indexRowIndex:-1 };
}
function resetPreview(){
  clearRuntimeState();
  clearImportResumeState();
  clearImportDraftState();
  $('summaryLine').textContent = 'Предпросмотр сброшен';
  $('errorsBox').innerHTML='';
  $('uidHint').innerHTML='';
  $('previewBody').innerHTML = '<tr><td colspan="7" class="small">Нет предпросмотра</td></tr>';
  updateRestoredFileInfo();
  updateStateLine();
  setButtons();
}

async function onParse(){
  $('writeWarning').innerHTML = '';
  refreshWho();

  const file = $('fileInput').files[0];
  if (!file) return;
  const parsedFileName = normStr(file.name);

  const buf = await new Promise(function(resolve, reject){
    const fr = new FileReader();
    fr.onload = function(){ resolve(fr.result); };
    fr.onerror = function(){ reject(fr.error || new Error('Ошибка чтения файла')); };
    fr.readAsArrayBuffer(file);
  }).catch(function(e){ alert('Не удалось прочитать файл: ' + (e.message || e)); return null; });
  if (!buf) return;

  try{ WB = XLSX.read(buf, { type:'array' }); }catch(e){ alert('Не удалось распарсить XLSX: ' + (e.message || e)); return; }
  if (!WB.SheetNames || !WB.SheetNames.length){ alert('В книге нет листов.'); return; }

  const res = parseSheetToRows(WB.Sheets[WB.SheetNames[0]]);
  if (!res.ok){
    alert('Не удалось построить предпросмотр: ' + res.msg);
    return;
  }

  dataRows = res.rows;
  primaryApplied = false;
  primaryBlocked = false;
  mode='primary';
  conflictDecision={};
  currentFileName = parsedFileName;
  restoredFromDraft = false;
  buildPreview();
  saveImportDraftState();
}

async function applyPrimary(){
  if (!canWriteOrExplain()) return setButtons();

  const db = getDB();
  if (!db || !db.abonents) return alert('База абонентов не загружена.');

  mode='primary';
  buildPreview();
  if (primaryBlocked) return alert('Шаг 1 заблокирован: есть критические ошибки первички.');

  const localSnapshot = { db: deepCloneJSONSafe(getDB()) };

  try {
  let updated=0, uidAssigned=0;

  for (let i=0;i<dataRows.length;i++){
    const row = dataRows[i];
    const found = findAbonentByRules(db, row);
    if (found.type==='UID_MISSING' || found.type==='NO_ID' || found.type==='AMBIG' || found.type==='NOT_FOUND') continue;
    if (!Number.isFinite(row.square) || row.square<=0) continue;

    let a = found.abonent;

    // Канон: ключуем по ЛС, UID — поле внутри записи.
    // Если UID не указан в Excel, но у абонента его ещё нет — генерируем (чтобы шаг 2 мог работать по UID).
    if (!normStr(row.uid) && found.type==='FOUND_BY_LS_FAM'){
      if (!normStr(a.uid)){
        a.uid = genUID();
        uidAssigned++;
      }
      row.uid = normStr(a.uid);
    } else if (normStr(row.uid)) {
      a.uid = normStr(row.uid);
    }

    a.id = normStr(row.ls) || a.id;
    a.fam = normStr(row.fam) || a.fam;
    a.name = normStr(row.name) || a.name;
    a.otch = normStr(row.otch) || a.otch;
    a.fio = toFio(a.fam,a.name,a.otch);
    a.square = row.square;
    row.ls = a.id;
    updated++;
  }

  saveDB();
  await Data.flushDbToServer();
  primaryApplied = true;
  mode='payments';
  buildPreview();
  saveImportDraftState();
  alert('Шаг 1 применён успешно.\nОбновлено строк первички: ' + updated + '\nПрисвоено UID: ' + uidAssigned);
  } catch (e) {
    console.error(e);
    alert('Ошибка сохранения первички на сервер. Локальные изменения будут откатаны.');
    await rollbackAfterFlushError(localSnapshot, { reason: 'import_apply_primary_flush_error', reload: true });
  }
}

async function applyPayments(){
  if (!canWriteOrExplain()) return setButtons();
  if (!primaryApplied) return alert('Шаг 2 заблокирован до успешной первички.');

  const db = getDB();
  if (!db || !db.abonents) return alert('База абонентов не загружена.');

  mode='payments';
  buildPreview();
  if (hasPaymentsCritical()) return alert('Шаг 2 заблокирован: есть ошибки платежей.');
  if (hasUnresolvedConflicts()) return alert('Шаг 2 заблокирован: есть нерешённые конфликты платежей.');

  const localSnapshot = {
    db: deepCloneJSONSafe(getDB()),
    payments: capturePaymentsSnapshot(db, dataRows)
  };

  try {
  let added=0, replaced=0, skipped=0, conflicts=0;

  for (let i=0;i<dataRows.length;i++){
    const row = dataRows[i];
    const uid = normStr(row.uid);
    const foundU = uid ? findAbonentByUid(db, uid) : null;
  const ab = foundU ? foundU.abonent : null;
    if (!ab) { skipped++; continue; }

    const ls = normStr(ab.id);
    let list = getPaymentsByLS(ls);

    for (let p=0;p<row.payments.length;p++){
      const pay = row.payments[p];
      if (!normStr(pay.amount) && !normStr(pay.periodRaw)) continue;
      const amount = normNum(pay.amount);
      const per = normalizePeriod(pay.periodRaw);
      if (!per || !Number.isFinite(amount) || amount<=0){ skipped++; continue; }

      const importedRow = buildImportedPaymentLedgerRow(list, per, amount);
      importedRow.paid_date = normalizePaidDate(pay.paidDateRaw || pay.periodRaw) || importedRow.paid_date;
      importedRow.payment_period = per.period;
      const dup = list.some(function(x){
        const ym = getLedgerYearMonth(x);
        const paid = getLedgerPaidAmount(x);
        const paidDate = getLedgerPaidDate(x);
        if (!ym || !Number.isFinite(paid)) return false;
        return ym.year === importedRow.year &&
          ym.month === importedRow.month &&
          paidDate === importedRow.paid_date &&
          paid === importedRow.paid;
      });
      if (dup){ skipped++; continue; }

      const idx = list.findIndex(function(x){
        const ym = getLedgerYearMonth(x);
        const paid = getLedgerPaidAmount(x);
        if (!ym || !Number.isFinite(paid) || paid <= 0) return false;
        return ym.year === importedRow.year && ym.month === importedRow.month;
      });
      if (idx >= 0){
        conflicts++;
        const decision = conflictDecision[ls + '::' + per.period];
        if (decision === 'overwrite'){
          list[idx] = importedRow;
          replaced++;
        } else {
          skipped++;
        }
        continue;
      }

      list.push(importedRow);
      added++;
    }

    sortLedgerRows(list);
    setPaymentsByLS(ls, list);
  }

  await Data.flushDbToServer();

  alert('Платежи применены.\nДобавлено: ' + added + '\nЗаменено: ' + replaced + '\nПропущено: ' + skipped + '\nКонфликтов обработано: ' + conflicts);
  clearRuntimeState();
  clearImportResumeState();
  clearImportDraftState();
  $('summaryLine').textContent = 'Импорт завершён. Предпросмотр очищен';
  $('errorsBox').innerHTML='';
  $('uidHint').innerHTML='';
  $('previewBody').innerHTML = '<tr><td colspan="7" class="small">Нет предпросмотра</td></tr>';
  updateRestoredFileInfo();
  updateStateLine();
  setButtons();
  } catch (e) {
    console.error(e);
    alert('Ошибка сохранения платежей на сервер. Локальные изменения будут откатаны.');
    await rollbackAfterFlushError(localSnapshot, { reason: 'import_apply_payments_flush_error', reload: true });
  }
}

$('previewBody').addEventListener('click', function(ev){
  const btn = ev.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.getAttribute('data-act');

  if (act === 'add'){
    if (!$('optAllowCreate').checked) return;
    const excelRow = Number(btn.getAttribute('data-excelrow'));
    const row = dataRows.find(x => x.excelRow===excelRow);
    const db = getDB();
    if (!row || !db || !db.abonents) return;

    if (normStr(row.uid)) return alert('В строке уже указан UID.');
    if (!normStr(row.ls) || !normStr(row.fam)) return alert('Нельзя создать абонента: пустые ЛС/ФИО.');
    if (!Number.isFinite(row.square) || row.square<=0) return alert('Нельзя создать абонента: "Общая площадь" должна быть > 0.');

    const draftOK = saveDraftNewAbonent(row);
    if (!draftOK) return alert('Не удалось сохранить draft для создания абонента.');

    saveImportResumeState({
      dataRows: dataRows,
      primaryApplied: primaryApplied,
      primaryBlocked: primaryBlocked,
      mode: mode,
      conflictDecision: conflictDecision,
      targetExcelRow: excelRow
    });
    saveImportDraftState();

    location.href = 'new_abonent.html?from=import';
    return;
  }

  if (act === 'conf_over' || act === 'conf_keep'){
    const key = btn.getAttribute('data-key');
    if (!key) return;
    conflictDecision[key] = act==='conf_over' ? 'overwrite' : 'keep';
    buildPreview();
    saveImportDraftState();
  }
});

(function init(){
  refreshWho();

  const draft = loadImportDraftState();
  if (draft && Array.isArray(draft.dataRows) && draft.dataRows.length){
    const draftOwner = normStr(draft.ownerId);
    const currentOwner = getCurrentOwnerId();
    if (!draftOwner || draftOwner === currentOwner){
      dataRows = draft.dataRows;
      mode = draft.mode === 'payments' ? 'payments' : 'primary';
      primaryApplied = !!draft.primaryApplied;
      primaryBlocked = !!draft.primaryBlocked;
      conflictDecision = draft.conflictDecision || {};
      currentFileName = normStr(draft.fileName);
      restoredFromDraft = true;
      buildPreview();
    }
  }

  tryResumeFromHash();

  $('fileInput').addEventListener('change', function(){ setButtons(); });
  $('optAllowCreate').addEventListener('change', function(){ renderPreview(); });

  $('btnModePrimary').addEventListener('click', function(){ mode='primary'; buildPreview(); });
  $('btnModePayments').addEventListener('click', function(){ if (!primaryApplied) return; mode='payments'; buildPreview(); });

  $('btnParse').addEventListener('click', onParse);
  $('btnReset').addEventListener('click', resetPreview);
  $('btnApplyPrimary').addEventListener('click', applyPrimary);
  $('btnApplyPayments').addEventListener('click', applyPayments);

  setButtons();
})();
</script>

<script>closeLayout();</script>
